services:
  - type: web
    name: traceid-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FORCE_DEMO_MODE
        value: "false"
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
